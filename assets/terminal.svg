<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">CipherNoct terminal</title>
  <desc id="termDesc">A live terminal session: whoami, bridge --status and a project listing typed into a stateful browser runtime.</desc>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05060A"/>
      <stop offset="0.5" stop-color="#080A11"/>
      <stop offset="1" stop-color="#05060A"/>
    </linearGradient>
    <radialGradient id="tglow" cx="210" cy="90" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E6DF5" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#4E6DF5" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#4E6DF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tglow2" cx="1040" cy="400" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tvignette" cx="600" cy="240" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#05060A" stop-opacity="0"/>
      <stop offset="1" stop-color="#05060A" stop-opacity="0.85"/>
    </radialGradient>

    <linearGradient id="tpanel" x1="60" y1="30" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0E17"/>
      <stop offset="0.55" stop-color="#090C14"/>
      <stop offset="1" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="tbar" x1="60" y1="30" x2="1140" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E121C"/>
      <stop offset="0.5" stop-color="#0C0F19"/>
      <stop offset="1" stop-color="#0B0E16"/>
    </linearGradient>
    <linearGradient id="tborder" x1="60" y1="30" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#2A3554" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#7B5CFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2A3554" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tborderBeam" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#8FA6FF" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#A8B8FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topLine" x1="60" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#6E8BFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#C9D2FF" stop-opacity="0.55"/>
      <stop offset="0.82" stop-color="#6E8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="tdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A3044"/>
    </pattern>
    <pattern id="tscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0.5" x2="4" y2="0.5" stroke="#A8B8FF" stroke-width="0.35" opacity="0.45"/>
    </pattern>

    <clipPath id="panelClip">
      <rect x="60" y="30" width="1080" height="420" rx="16"/>
    </clipPath>

    <filter id="panelShadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#010206" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="34" flood-color="#4E6DF5" flood-opacity="0.10"/>
    </filter>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#tbg)"/>
  <ellipse cx="240" cy="120" rx="420" ry="240" fill="url(#tglow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;22 -10;0 0" dur="21s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </ellipse>
  <ellipse cx="1010" cy="386" rx="380" ry="220" fill="url(#tglow2)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-18 8;0 0" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </ellipse>
  <rect width="1200" height="480" fill="url(#tdots)" opacity="0.14"/>

  <rect width="1200" height="480" fill="url(#tvignette)"/>

  <g font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="7.2" letter-spacing="1.1" fill="#3E4A6B" opacity="0">
    <animate attributeName="opacity" from="0" to="0.38" begin="1.1s" dur="1.6s" fill="freeze"/>
    <g opacity="0.7" text-anchor="end">
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="8s" repeatCount="indefinite"/>
      <text x="52" y="128">BRIDGE.04</text>
      <text x="52" y="148">STATE:OK</text>
      <text x="52" y="168">QUEUE 0</text>
    </g>
    <g opacity="0.7">
      <animate attributeName="opacity" values="0.25;0.65;0.25" dur="11s" begin="2s" repeatCount="indefinite"/>
      <text x="1196" y="320" text-anchor="end">TLS 1.3</text>
      <text x="1196" y="340" text-anchor="end">MEM 42M</text>
      <text x="1196" y="360" text-anchor="end">PID 7331</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.08s" dur="0.75s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.08s" dur="1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>

    <rect x="60.5" y="30.5" width="1079" height="419" rx="16" fill="#02040A" filter="url(#panelShadow)"/>
    <rect x="60.5" y="30.5" width="1079" height="419" rx="16" fill="url(#tpanel)" stroke="url(#tborder)"/>
    <rect x="61.5" y="31.5" width="1077" height="417" rx="15" fill="none" stroke="#000000" opacity="0.35"/>

    <g clip-path="url(#panelClip)">
      <rect x="60" y="30" width="1080" height="52" fill="url(#tbar)"/>
      <rect x="60" y="30" width="1080" height="1" fill="url(#topLine)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite"/>
      </rect>
      <line x1="60" y1="82" x2="1140" y2="82" stroke="#1A2030"/>
      <line x1="60" y1="82.5" x2="1140" y2="82.5" stroke="#0A0D15"/>

      <rect x="-300" y="30" width="220" height="420" fill="url(#sheenBand)" opacity="0.55">
        <animate attributeName="x" values="-300;1280" dur="12s" begin="4.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.55 1"/>
      </rect>

      <rect x="60" y="83" width="1080" height="367" fill="url(#tscan)" opacity="0.05"/>

      <g>
        <circle cx="92" cy="56" r="3.6" fill="#3A2B33"/>
        <circle cx="92" cy="56" r="3.6" fill="#5A3A44" opacity="0.5"/>
        <circle cx="114" cy="56" r="3.6" fill="#3A362B"/>
        <circle cx="136" cy="56" r="3.6" fill="#7D95FF" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="136" cy="56" r="7.5" fill="none" stroke="#6E8BFF" stroke-width="0.6" opacity="0">
          <animate attributeName="r" values="5;10" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0" dur="3.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <text x="600" y="60" text-anchor="middle" font-size="11" letter-spacing="1.6" fill="#565E74">ciphernoct@bridge: ~/projects</text>
      <text x="1112" y="60" text-anchor="end" font-size="9.5" letter-spacing="1.4" fill="#3D4458">zsh</text>
      <text x="1112" y="72" text-anchor="end" font-size="8" letter-spacing="1.2" fill="#2E3547">80 × 24</text>

      <rect x="60" y="30" width="1080" height="420" rx="16" fill="none" stroke="url(#tborderBeam)" stroke-width="1.2" stroke-dasharray="190 2700" stroke-linecap="round" opacity="0.8">
        <animate attributeName="stroke-dashoffset" from="0" to="-2890" dur="14s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17.5">

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.50s" dur="0.25s" fill="freeze"/>
        <text x="96" y="124" fill="#6E8BFF" opacity="0.6" filter="url(#softGlow)">$</text>
        <text x="96" y="124" fill="#7D95FF">$</text>
      </g>
      <clipPath id="t1">
        <rect x="118" y="107" width="0" height="25">
          <animate attributeName="width" values="0.0;11.2;22.4;33.6;44.8;56.0;67.2" begin="0.64s" dur="0.50s" fill="freeze" calcMode="discrete"/>
        </rect>
      </clipPath>
      <g clip-path="url(#t1)">
        <text x="118" y="124" fill="#E8EAF1">whoami</text>
      </g>
      <rect x="118" y="109.5" width="8.5" height="18.5" rx="1.2" fill="#C9CEFF" opacity="0">
        <animate attributeName="x" values="118.0;129.2;140.4;151.6;162.8;174.0;185.2" begin="0.64s" dur="0.50s" fill="freeze" calcMode="discrete"/>
        <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.93;1" begin="0.64s" dur="0.50s" fill="freeze"/>
      </rect>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.30s" dur="0.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 5" to="0 0" begin="1.30s" dur="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
        <text x="96" y="154" fill="#8F98AD">ciphernoct — builds automation that outlives its interfaces.</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.62s" dur="0.25s" fill="freeze"/>
        <text x="96" y="214" fill="#6E8BFF" opacity="0.6" filter="url(#softGlow)">$</text>
        <text x="96" y="214" fill="#7D95FF">$</text>
      </g>
      <clipPath id="t2">
        <rect x="118" y="197" width="0" height="25">
          <animate attributeName="width" values="0.0;11.2;22.4;33.6;44.8;56.0;67.2;78.4;89.6;100.8;112.0;123.2;134.4;145.6;156.8;168.0" begin="1.76s" dur="0.82s" fill="freeze" calcMode="discrete"/>
        </rect>
      </clipPath>
      <g clip-path="url(#t2)">
        <text x="118" y="214" fill="#E8EAF1">bridge --status</text>
      </g>
      <rect x="118" y="199.5" width="8.5" height="18.5" rx="1.2" fill="#C9CEFF" opacity="0">
        <animate attributeName="x" values="118.0;129.2;140.4;151.6;162.8;174.0;185.2;196.4;207.6;218.8;230.0;241.2;252.4;263.6;274.8;286.0" begin="1.76s" dur="0.82s" fill="freeze" calcMode="discrete"/>
        <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.93;1" begin="1.76s" dur="0.82s" fill="freeze"/>
      </rect>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.72s" dur="0.55s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.72s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
        <text x="96" y="244"><tspan fill="#7D95FF">runtime</tspan><tspan x="192" fill="#8F98AD">real browser · scriptable · stateful</tspan></text>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="2.94s" dur="0.45s" fill="freeze"/>
          <circle cx="1054" cy="240" r="2" fill="#6E8BFF">
            <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="3.42s" repeatCount="indefinite"/>
          </circle>
          <text x="1104" y="244" text-anchor="end" font-size="9.5" letter-spacing="1.6" fill="#56627F">READY</text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2.92s" dur="0.55s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.92s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
        <text x="96" y="274"><tspan fill="#7D95FF">ai</tspan><tspan x="192" fill="#8F98AD">LLM operators for real workflows</tspan></text>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="3.14s" dur="0.45s" fill="freeze"/>
          <circle cx="1054" cy="270" r="2" fill="#6E8BFF">
            <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="3.62s" repeatCount="indefinite"/>
          </circle>
          <text x="1104" y="274" text-anchor="end" font-size="9.5" letter-spacing="1.6" fill="#56627F">LIVE</text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.12s" dur="0.55s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="3.12s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1"/>
        <text x="96" y="304"><tspan fill="#7D95FF">output</tspan><tspan x="192" fill="#8F98AD">CLI-first · composable · agent-ready</tspan></text>
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" begin="3.34s" dur="0.45s" fill="freeze"/>
          <circle cx="1054" cy="300" r="2" fill="#6E8BFF">
            <animate attributeName="opacity" values="1;0.25;1" dur="2.6s" begin="3.82s" repeatCount="indefinite"/>
          </circle>
          <text x="1104" y="304" text-anchor="end" font-size="9.5" letter-spacing="1.6" fill="#56627F">SYNC</text>
        </g>
      </g>


      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.42s" dur="0.25s" fill="freeze"/>
        <text x="96" y="364" fill="#6E8BFF" opacity="0.6" filter="url(#softGlow)">$</text>
        <text x="96" y="364" fill="#7D95FF">$</text>
      </g>
      <clipPath id="t3">
        <rect x="118" y="347" width="0" height="25">
          <animate attributeName="width" values="0.0;11.2;22.4;33.6;44.8;56.0;67.2;78.4;89.6;100.8;112.0;123.2;134.4;145.6" begin="3.56s" dur="0.70s" fill="freeze" calcMode="discrete"/>
        </rect>
      </clipPath>
      <g clip-path="url(#t3)">
        <text x="118" y="364" fill="#E8EAF1">ls ~/projects</text>
      </g>
      <rect x="118" y="349.5" width="8.5" height="18.5" rx="1.2" fill="#C9CEFF" opacity="0">
        <animate attributeName="x" values="118.0;129.2;140.4;151.6;162.8;174.0;185.2;196.4;207.6;218.8;230.0;241.2;252.4;263.6" begin="3.56s" dur="0.70s" fill="freeze" calcMode="discrete"/>
        <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.93;1" begin="3.56s" dur="0.70s" fill="freeze"/>
      </rect>

      <g>
        <text x="96" y="394" font-size="16.5"><tspan fill="#D8DCE7" opacity="0">douyin-cli<animate attributeName="opacity" from="0" to="1" begin="4.30s" dur="0.35s" fill="freeze"/></tspan><tspan fill="#4D556C" opacity="0"> · <animate attributeName="opacity" from="0" to="1" begin="4.35s" dur="0.3s" fill="freeze"/></tspan><tspan fill="#D8DCE7" opacity="0">douyin-living<animate attributeName="opacity" from="0" to="1" begin="4.41s" dur="0.35s" fill="freeze"/></tspan><tspan fill="#4D556C" opacity="0"> · <animate attributeName="opacity" from="0" to="1" begin="4.46s" dur="0.3s" fill="freeze"/></tspan><tspan fill="#D8DCE7" opacity="0">tiktok-cli<animate attributeName="opacity" from="0" to="1" begin="4.52s" dur="0.35s" fill="freeze"/></tspan><tspan fill="#4D556C" opacity="0"> · <animate attributeName="opacity" from="0" to="1" begin="4.58s" dur="0.3s" fill="freeze"/></tspan><tspan fill="#D8DCE7" opacity="0">xiaohongshu-cli<animate attributeName="opacity" from="0" to="1" begin="4.63s" dur="0.35s" fill="freeze"/></tspan><tspan fill="#4D556C" opacity="0"> · <animate attributeName="opacity" from="0" to="1" begin="4.69s" dur="0.3s" fill="freeze"/></tspan><tspan fill="#D8DCE7" opacity="0">BossZhipin-cli<animate attributeName="opacity" from="0" to="1" begin="4.74s" dur="0.35s" fill="freeze"/></tspan><tspan fill="#4D556C" opacity="0"> · <animate attributeName="opacity" from="0" to="1" begin="4.80s" dur="0.3s" fill="freeze"/></tspan><tspan fill="#D8DCE7" opacity="0">ths-cli<animate attributeName="opacity" from="0" to="1" begin="4.85s" dur="0.35s" fill="freeze"/></tspan></text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="5.02s" dur="0.25s" fill="freeze"/>
        <text x="96" y="428" fill="#6E8BFF" opacity="0.6" filter="url(#softGlow)">$</text>
        <text x="96" y="428" fill="#7D95FF">$</text>
      </g>

      <rect x="118" y="413" width="9" height="18" rx="1" fill="#C9CEFF" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.52;1" begin="5.18s" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="4.8s" dur="0.8s" fill="freeze"/>
        <circle cx="925" cy="424" r="2" fill="#6E8BFF">
          <animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <text x="1112" y="428" text-anchor="end" font-size="10" letter-spacing="1.2" fill="#4B5470">bridge framework · online</text>
      </g>
    </g>
  </g>

</svg>
