<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">CipherNoct terminal</title>
  <desc id="termDesc">whoami, bridge --status and a list of projects, typed into a terminal.</desc>

  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07080C"/>
      <stop offset="0.55" stop-color="#090B11"/>
      <stop offset="1" stop-color="#07080C"/>
    </linearGradient>
    <radialGradient id="tglow" cx="180" cy="70" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B7CFA" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5B7CFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tpanel" x1="60" y1="30" x2="1140" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0E16"/>
      <stop offset="1" stop-color="#090B12"/>
    </linearGradient>
    <clipPath id="panelClip">
      <rect x="60" y="30" width="1080" height="420" rx="16"/>
    </clipPath>
    <pattern id="tdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A3044"/>
    </pattern>
  </defs>

  <rect width="1200" height="480" fill="url(#tbg)"/>
  <rect width="1200" height="480" fill="url(#tdots)" opacity="0.14"/>
  <rect width="1200" height="480" fill="url(#tglow)"/>

  <rect x="60.5" y="30.5" width="1079" height="419" rx="16" fill="url(#tpanel)" stroke="#1E2434"/>

  <g clip-path="url(#panelClip)">
    <rect x="60" y="30" width="1080" height="52" fill="#0D1019"/>
    <line x1="60" y1="82" x2="1140" y2="82" stroke="#181D2B"/>
  </g>

  <g>
    <circle cx="92" cy="56" r="3.5" fill="#242B3C"/>
    <circle cx="114" cy="56" r="3.5" fill="#2A3143"/>
    <circle cx="136" cy="56" r="3.5" fill="#7D95FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="60" text-anchor="middle" font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5" fill="#565E74">ciphernoct@bridge: ~/projects</text>
  <text x="1112" y="60" text-anchor="end" font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1" fill="#3D4458">zsh</text>

  <g font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.4s" fill="freeze"/>
      <text x="96" y="124"><tspan fill="#7D95FF">$</tspan><tspan fill="#E8EAF1"> whoami</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.4s" fill="freeze"/>
      <text x="96" y="154" fill="#9099AD">ciphernoct — builds automation that outlives its interfaces.</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.4s" fill="freeze"/>
      <text x="96" y="214"><tspan fill="#7D95FF">$</tspan><tspan fill="#E8EAF1"> bridge --status</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.65s" dur="0.4s" fill="freeze"/>
      <text x="96" y="244"><tspan fill="#7D95FF">runtime</tspan><tspan x="192" fill="#9099AD">real browser · scriptable · stateful</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.95s" dur="0.4s" fill="freeze"/>
      <text x="96" y="274"><tspan fill="#7D95FF">ai</tspan><tspan x="192" fill="#9099AD">LLM operators for real workflows</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.25s" dur="0.4s" fill="freeze"/>
      <text x="96" y="304"><tspan fill="#7D95FF">output</tspan><tspan x="192" fill="#9099AD">CLI-first · composable · agent-ready</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
      <text x="96" y="364"><tspan fill="#7D95FF">$</tspan><tspan fill="#E8EAF1"> ls ~/projects</tspan></text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.05s" dur="0.4s" fill="freeze"/>
      <text x="96" y="394" font-size="16.5">
        <tspan fill="#D8DCE7">douyin-cli</tspan><tspan fill="#4D556C"> · </tspan><tspan fill="#D8DCE7">douyin-living</tspan><tspan fill="#4D556C"> · </tspan><tspan fill="#D8DCE7">tiktok-cli</tspan><tspan fill="#4D556C"> · </tspan><tspan fill="#D8DCE7">xiaohongshu-cli</tspan><tspan fill="#4D556C"> · </tspan><tspan fill="#D8DCE7">BossZhipin-cli</tspan><tspan fill="#4D556C"> · </tspan><tspan fill="#D8DCE7">ths-cli</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.8s" dur="0.3s" fill="freeze"/>
      <text x="96" y="428" fill="#7D95FF">$</text>
    </g>

    <rect x="118" y="411" width="9" height="18" rx="1" fill="#C9CEFF" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.52;1" begin="3.95s" dur="1.1s" repeatCount="indefinite"/>
    </rect>

  </g>

  <text x="1112" y="428" text-anchor="end" font-family="'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1" fill="#333A4D" opacity="0">bridge framework · online
    <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.6s" fill="freeze"/>
  </text>

</svg>
