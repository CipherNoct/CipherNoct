<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="pipeTitle pipeDesc">
  <title id="pipeTitle">Live to highlight pipeline</title>
  <desc id="pipeDesc">Capture, listen, fuse, rank and cut: a live stream becomes highlight clips through audio, text, danmaku and visual signals.</desc>

  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07080C"/>
      <stop offset="0.55" stop-color="#090B11"/>
      <stop offset="1" stop-color="#07080C"/>
    </linearGradient>
    <radialGradient id="pglow" cx="600" cy="280" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B7CFA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5B7CFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pdots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A3044"/>
    </pattern>
    <linearGradient id="curveStroke" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#44506E"/>
      <stop offset="0.55" stop-color="#6E8BFF"/>
      <stop offset="1" stop-color="#96A8FF"/>
    </linearGradient>
    <linearGradient id="curveFill" x1="0" y1="400" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>
    <marker id="parrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5C6FA8"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#pbg)"/>
  <rect width="1200" height="560" fill="url(#pdots)" opacity="0.14"/>
  <rect width="1200" height="560" fill="url(#pglow)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="62" font-size="10" letter-spacing="4" fill="#5F78D8">03 / CASE STUDY</text>
    <text x="50" y="104" font-size="34" font-weight="500" letter-spacing="1" fill="#E8EAF1">Live → Highlight</text>
    <text x="50" y="132" font-size="12.5" letter-spacing="0.5" fill="#7C849A">一条直播流的完整旅程：录制 · 听写 · 融合 · 定位 · 成片。</text>
    <circle cx="1004" cy="58" r="3" fill="#6E8BFF">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1150" y="62" text-anchor="end" font-size="9.5" letter-spacing="2.5" fill="#4F5870">DOUYIN-LIVING</text>
  </g>

  <!-- stage cards -->
  <g>
    <!-- 01 capture -->
    <g>
      <rect x="50" y="170" width="196" height="190" rx="10" fill="#0A0D15" stroke="#1E2638"/>
      <rect x="50" y="170" width="2.5" height="190" rx="1.2" fill="#6E8BFF" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <text x="68" y="202" font-size="9" letter-spacing="2.5" fill="#4F5870" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">01</text>
      <text x="68" y="226" font-size="12.5" letter-spacing="2.2" fill="#D8DCE7">CAPTURE</text>
      <line x1="68" y1="240" x2="228" y2="240" stroke="#1A2030"/>
      <circle cx="228" cy="260" r="2.6" fill="#96A8FF">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <g fill="#2A3350">
        <rect x="68"  y="298" width="4" height="10" rx="2"/>
        <rect x="82"  y="290" width="4" height="18" rx="2"/>
        <rect x="96"  y="282" width="4" height="26" rx="2"/>
        <rect x="110" y="294" width="4" height="14" rx="2"/>
        <rect x="124" y="278" width="4" height="30" rx="2"/>
        <rect x="138" y="286" width="4" height="22" rx="2"/>
        <rect x="152" y="296" width="4" height="12" rx="2"/>
        <rect x="166" y="282" width="4" height="26" rx="2"/>
        <rect x="180" y="290" width="4" height="18" rx="2"/>
        <rect x="194" y="278" width="4" height="30" rx="2"/>
        <rect x="208" y="296" width="4" height="12" rx="2"/>
        <rect x="222" y="300" width="4" height="8" rx="2"/>
      </g>
      <g fill="#6E8BFF">
        <rect x="96" y="282" width="4" height="26" rx="2" opacity="0.6">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="138" y="286" width="4" height="22" rx="2" opacity="0.6">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="194" y="278" width="4" height="30" rx="2" opacity="0.6">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="68" y="336" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">FLV 4K + AAC</text>
      <text x="68" y="352" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">danmaku WebSocket</text>
    </g>

    <!-- 02 listen -->
    <g>
      <rect x="276" y="170" width="196" height="190" rx="10" fill="#0A0D15" stroke="#1E2638"/>
      <rect x="276" y="170" width="2.5" height="190" rx="1.2" fill="#6E8BFF" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.4s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <text x="294" y="202" font-size="9" letter-spacing="2.5" fill="#4F5870" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">02</text>
      <text x="294" y="226" font-size="12.5" letter-spacing="2.2" fill="#D8DCE7">LISTEN</text>
      <line x1="294" y1="240" x2="454" y2="240" stroke="#1A2030"/>
      <path d="M294 268 L306 262 L318 274 L330 266 L342 278 L354 264 L366 272 L378 258 L390 276 L402 266 L414 270 L426 260 L438 272 L450 264 L454 268" fill="none" stroke="#44506E" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="294" y="286" width="150" height="5" rx="2.5" fill="#2A3350">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="294" y="298" width="118" height="5" rx="2.5" fill="#6E8BFF" opacity="0.45">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="294" y="310" width="90" height="5" rx="2.5" fill="#2A3350">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="294" y="336" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">faster-whisper</text>
      <text x="294" y="352" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">WhisperX · speaker turns</text>
    </g>

    <!-- 03 fuse -->
    <g>
      <rect x="502" y="170" width="196" height="190" rx="10" fill="#0A0D15" stroke="#1E2638"/>
      <rect x="502" y="170" width="2.5" height="190" rx="1.2" fill="#6E8BFF" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.4s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="520" y="202" font-size="9" letter-spacing="2.5" fill="#4F5870" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">03</text>
      <text x="520" y="226" font-size="12.5" letter-spacing="2.2" fill="#D8DCE7">FUSE</text>
      <line x1="520" y1="240" x2="680" y2="240" stroke="#1A2030"/>
      <g fill="none" stroke="#44506E" stroke-width="1.2">
        <path d="M520 268 L588 290"/>
        <path d="M520 290 L588 290"/>
        <path d="M520 312 L588 290"/>
      </g>
      <circle cx="588" cy="290" r="3" fill="#6E8BFF">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M588 290 L680 290" stroke="#6E8BFF" stroke-width="1.4" stroke-dasharray="3 5">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <circle r="2.6" fill="#96A8FF">
        <animateMotion dur="1.6s" repeatCount="indefinite" path="M588 290 H680"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="520" y="336" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">3-layer AI</text>
      <text x="520" y="352" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">7 signal methods</text>
    </g>

    <!-- 04 rank -->
    <g>
      <rect x="728" y="170" width="196" height="190" rx="10" fill="#0A0D15" stroke="#1E2638"/>
      <rect x="728" y="170" width="2.5" height="190" rx="1.2" fill="#6E8BFF" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="746" y="202" font-size="9" letter-spacing="2.5" fill="#4F5870" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">04</text>
      <text x="746" y="226" font-size="12.5" letter-spacing="2.2" fill="#D8DCE7">RANK</text>
      <line x1="746" y1="240" x2="906" y2="240" stroke="#1A2030"/>
      <rect x="746" y="268" width="150" height="8" rx="4" fill="#2A3350">
        <animate attributeName="width" from="0" to="150" begin="0.4s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 1 0.3 1"/>
      </rect>
      <rect x="746" y="268" width="150" height="8" rx="4" fill="#6E8BFF" opacity="0.75">
        <animate attributeName="width" from="0" to="150" begin="0.4s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 1 0.3 1"/>
        <animate attributeName="opacity" values="0.55;0.95;0.55" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="746" y="286" width="112" height="8" rx="4" fill="#2A3350">
        <animate attributeName="width" from="0" to="112" begin="0.6s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 1 0.3 1"/>
      </rect>
      <rect x="746" y="304" width="74" height="8" rx="4" fill="#2A3350">
        <animate attributeName="width" from="0" to="74" begin="0.8s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 1 0.3 1"/>
      </rect>
      <text x="746" y="336" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">recall → refine</text>
      <text x="746" y="352" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">profile · sensitivity</text>
    </g>

    <!-- 05 cut -->
    <g>
      <rect x="954" y="170" width="196" height="190" rx="10" fill="#0A0D15" stroke="#1E2638"/>
      <rect x="954" y="170" width="2.5" height="190" rx="1.2" fill="#6E8BFF" opacity="0.3">
        <animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.4s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="972" y="202" font-size="9" letter-spacing="2.5" fill="#4F5870" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">05</text>
      <text x="972" y="226" font-size="12.5" letter-spacing="2.2" fill="#D8DCE7">CUT</text>
      <line x1="972" y1="240" x2="1132" y2="240" stroke="#1A2030"/>

      <rect x="972"  y="272" width="27" height="38" rx="3" fill="#121826" stroke="#26304A"/>
      <rect x="1006" y="272" width="27" height="38" rx="3" fill="#121A2B" stroke="#6E8BFF">
        <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="1040" y="272" width="27" height="38" rx="3" fill="#121826" stroke="#26304A"/>
      <rect x="1074" y="272" width="27" height="38" rx="3" fill="#121A2B" stroke="#6E8BFF">
        <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1108" y="272" width="27" height="38" rx="3" fill="#121826" stroke="#26304A"/>
      <g fill="#6E8BFF" opacity="0.8">
        <path d="M1016 285 L1016 297 L1026 291 Z"/>
        <path d="M1084 285 L1084 297 L1094 291 Z"/>
      </g>
      <text x="972" y="336" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">ffmpeg lossless</text>
      <text x="972" y="352" font-size="11" fill="#6F778C" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">subtitles · covers</text>
    </g>
  </g>

  <!-- connectors -->
  <g stroke="#44506E" stroke-width="1.1" fill="none">
    <path d="M246 265 H268" stroke-dasharray="2 4" marker-end="url(#parrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M472 265 H494" stroke-dasharray="2 4" marker-end="url(#parrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M698 265 H720" stroke-dasharray="2 4" marker-end="url(#parrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M924 265 H946" stroke-dasharray="2 4" marker-end="url(#parrow)">
      <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#96A8FF">
    <circle r="2.2"><animateMotion dur="1.4s" repeatCount="indefinite" path="M246 265 H268"/></circle>
    <circle r="2.2"><animateMotion dur="1.4s" begin="0.35s" repeatCount="indefinite" path="M472 265 H494"/></circle>
    <circle r="2.2"><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M698 265 H720"/></circle>
    <circle r="2.2"><animateMotion dur="1.4s" begin="1.05s" repeatCount="indefinite" path="M924 265 H946"/></circle>
  </g>

  <!-- score panel -->
  <g>
    <rect x="50" y="392" width="1100" height="118" rx="12" fill="#0A0D15" stroke="#1E2638"/>
    <text x="72" y="420" font-size="9" letter-spacing="3" fill="#7D95FF" font-family="Inter, -apple-system, Arial, sans-serif">SIGNAL / 7 METHODS FUSED</text>
    <text x="1128" y="420" text-anchor="end" font-size="9" letter-spacing="2" fill="#454E68" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">SCORE → CANDIDATES → CLIPS</text>

    <path d="M72 486 L140 480 L208 488 L276 474 L344 482 L412 458 L480 468 L548 438 L616 462 L684 446 L752 410 L820 478 L888 462 L956 484 L1024 468 L1128 486 L1128 492 L72 492 Z" fill="url(#curveFill)"/>
    <path d="M72 486 L140 480 L208 488 L276 474 L344 482 L412 458 L480 468 L548 438 L616 462 L684 446 L752 410 L820 478 L888 462 L956 484 L1024 468 L1128 486" fill="none" stroke="url(#curveStroke)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1200" stroke-dashoffset="1200">
      <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="3s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 1 0.3 1"/>
    </path>

    <line x1="752" y1="410" x2="752" y2="492" stroke="#6E8BFF" stroke-width="1" stroke-dasharray="2 5" opacity="0.5">
      <animate attributeName="opacity" values="0.25;0.75;0.25" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </line>
    <circle cx="752" cy="410" r="2.6" fill="#96A8FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="762" y="408" font-size="8" letter-spacing="1.5" fill="#96A8FF" font-family="'SF Mono', SFMono-Regular, Menlo, monospace">PEAK</text>

    <circle r="3" fill="#E8EAFF">
      <animateMotion dur="6s" begin="1s" repeatCount="indefinite" path="M72 486 L140 480 L208 488 L276 474 L344 482 L412 458 L480 468 L548 438 L616 462 L684 446 L752 410 L820 478 L888 462 L956 484 L1024 468 L1128 486"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <rect x="530" y="495" width="90" height="6" rx="3" fill="#6E8BFF" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="748" y="495" width="80" height="6" rx="3" fill="#6E8BFF" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="256" y="495" width="54" height="6" rx="3" fill="#44506E" opacity="0.55"/>
  </g>

  <g font-family="'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="9" letter-spacing="1.6" fill="#454E68">
    <text x="50" y="540">AUDIO · TEXT · DANMAKU · VISUAL — FUSED INTO ONE DECISION</text>
    <text x="1150" y="540" text-anchor="end">python · ffmpeg · whisperx</text>
  </g>
</svg>
