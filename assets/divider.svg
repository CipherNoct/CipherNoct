<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30" role="img" aria-label="divider">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#33405F" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7D95FF" stop-opacity="0.8"/>
      <stop offset="0.78" stop-color="#33405F" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#8FA6FF" stop-opacity="0.7"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#A8B8FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx="600" cy="15" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9D2FF" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#6E8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="dglow" x="-40%" y="-400%" width="180%" height="900%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <line x1="0" y1="15" x2="1200" y2="15" stroke="url(#rail)" stroke-width="1.2">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite"/>
  </line>

  <g filter="url(#dglow)">
    <rect x="-220" y="13.8" width="220" height="2.4" rx="1.2" fill="url(#beam)">
      <animate attributeName="x" values="-220;1200" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" keyTimes="0;1"/>
    </rect>
    <rect x="-140" y="14.3" width="140" height="1.4" rx="0.7" fill="url(#beam)" opacity="0.65">
      <animate attributeName="x" values="-140;1200" dur="14s" begin="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.35 0 0.65 1" keyTimes="0;1"/>
    </rect>
  </g>

  <ellipse cx="600" cy="15" rx="26" ry="7" fill="url(#core)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4.6s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <circle cx="600" cy="15" r="2.2" fill="#E8EAFF">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;2.5;2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="597.6" y="12.6" width="4.8" height="4.8" rx="0.8" fill="#6E8BFF" opacity="0.7" transform="rotate(45 600 15)">
      <animateTransform attributeName="transform" type="rotate" from="45 600 15" to="405 600 15" dur="18s" repeatCount="indefinite"/>
    </rect>
    <circle cx="600" cy="15" r="5" fill="none" stroke="#8FA6FF" stroke-width="0.8" opacity="0.6">
      <animate attributeName="r" values="4;15;4" dur="5.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0.6 0.3 1;0.2 0.6 0.3 1" keyTimes="0;0.45;1"/>
      <animate attributeName="opacity" values="0.65;0.18;0.65" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="15" r="5" fill="none" stroke="#6E8BFF" stroke-width="0.6" opacity="0">
      <animate attributeName="r" values="4;22" dur="5.4s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="5.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#8FA6FF">
    <circle cx="324" cy="15" r="1" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="858" cy="15" r="1" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="462" cy="15" r="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.08;0.4;0.08" dur="8.5s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="15" r="0.8" opacity="0.2">
      <animate attributeName="opacity" values="0.08;0.42;0.08" dur="9s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
