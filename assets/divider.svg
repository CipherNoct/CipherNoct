<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="30" viewBox="0 0 1200 30" role="img" aria-label="divider">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A8B8FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="15" x2="1200" y2="15" stroke="#1A2030" stroke-width="1"/>
  <rect x="-180" y="14" width="180" height="2" rx="1" fill="url(#beam)">
    <animate attributeName="x" values="-180;1200" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
