<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">CipherNoct</title>
  <desc id="heroDesc">Turn platforms into command lines. Let AI be the operator. 把平台变成命令行，让 AI 成为操作员。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07080C"/>
      <stop offset="0.5" stop-color="#0A0C12"/>
      <stop offset="1" stop-color="#080910"/>
    </linearGradient>

    <radialGradient id="glow" cx="600" cy="178" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B7CFA" stop-opacity="0.17"/>
      <stop offset="0.55" stop-color="#5B7CFA" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#5B7CFA" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameGrad" x1="240" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F6FA"/>
      <stop offset="0.5" stop-color="#D8DCFF">
        <animate attributeName="stop-color" values="#D8DCFF;#96A9FF;#D8DCFF" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#96A8FF"/>
    </linearGradient>

    <linearGradient id="scanline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8BFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A8B8FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6E8BFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2A3044"/>
    </pattern>

    <clipPath id="nameReveal">
      <rect x="240" y="126" width="0" height="112">
        <animate attributeName="width" from="0" to="720" begin="1.15s" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)" opacity="0.32"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <g fill="none" stroke="#6E8BFF" opacity="0.13">
    <circle cx="600" cy="194" r="214" stroke-width="1" stroke-dasharray="1 9">
      <animateTransform attributeName="transform" type="rotate" from="0 600 194" to="360 600 194" dur="90s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="194" r="166" stroke-width="1" stroke-dasharray="1 14" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360 600 194" to="0 600 194" dur="70s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#7D95FF">
    <circle cx="152" cy="296" r="1.5" opacity="0.25">
      <animate attributeName="cy" values="296;262;296" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.45;0.12" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1048" cy="138" r="1.5" opacity="0.2">
      <animate attributeName="cy" values="138;112;138" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="986" cy="322" r="1" opacity="0.2">
      <animate attributeName="cy" values="322;292;322" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="222" cy="118" r="1" opacity="0.2">
      <animate attributeName="cy" values="118;96;118" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.32;0.08" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="762" cy="76" r="1" opacity="0.2">
      <animate attributeName="cy" values="76;58;76" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.3;0.08" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="424" cy="92" r="1.5" opacity="0.2">
      <animate attributeName="cy" values="92;72;92" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.35;0.1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1116" cy="246" r="1" opacity="0.2">
      <animate attributeName="cy" values="246;222;246" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.3;0.08" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="86" cy="258" r="1" opacity="0.2">
      <animate attributeName="cy" values="258;236;258" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.28;0.08" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="368" r="1" opacity="0.2">
      <animate attributeName="cy" values="368;346;368" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.3;0.08" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="884" cy="190" r="1" opacity="0.2">
      <animate attributeName="cy" values="190;172;190" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.26;0.08" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="60" width="1200" height="1" fill="url(#scanline)" opacity="0">
    <animate attributeName="y" values="64;352" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.18;0.82;1" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <line x1="446" y1="88" x2="528" y2="88" stroke="#202636" stroke-width="1"/>
    <line x1="672" y1="88" x2="754" y2="88" stroke="#202636" stroke-width="1"/>
    <text x="597.5" y="92" text-anchor="middle" font-size="11" letter-spacing="5" fill="#77809A">AI-NATIVE AUTOMATION</text>

    <text x="596" y="208" text-anchor="middle" font-size="88" font-weight="500" letter-spacing="14" fill="#5F78D8" opacity="0">C1PH3RN0CT
      <animate attributeName="opacity" values="0;0.5;0.14;0.55;0.1;0.4;0;0" keyTimes="0;0.12;0.25;0.4;0.55;0.7;0.9;1" dur="2.4s" fill="freeze"/>
    </text>

    <g clip-path="url(#nameReveal)">
      <text x="596" y="208" text-anchor="middle" font-size="88" font-weight="500" letter-spacing="14" fill="url(#nameGrad)">CIPHERNOCT</text>
    </g>

    <rect x="240" y="146" width="2" height="78" fill="#A8B8FF" opacity="0">
      <animate attributeName="x" values="240;960" begin="1.15s" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.05;0.88;1" begin="1.15s" dur="1.75s" fill="freeze"/>
    </rect>

    <text x="596.5" y="272" text-anchor="middle" font-size="15" letter-spacing="7" fill="#AEB6CB" opacity="0">TURN PLATFORMS INTO COMMAND LINES.
      <animate attributeName="opacity" from="0" to="1" begin="2.55s" dur="0.9s" fill="freeze"/>
    </text>

    <text x="598.5" y="305" text-anchor="middle" font-size="14" letter-spacing="3" fill="#697188" opacity="0" font-family="Inter, -apple-system, 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">把平台变成命令行 · 让 AI 成为操作员
      <animate attributeName="opacity" from="0" to="1" begin="2.85s" dur="0.9s" fill="freeze"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.7s" fill="freeze"/>
      <line x1="600" y1="342" x2="600" y2="342" stroke="#6E8BFF" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="x1" from="600" to="572" begin="3.15s" dur="0.65s" fill="freeze"/>
        <animate attributeName="x2" from="600" to="628" begin="3.15s" dur="0.65s" fill="freeze"/>
      </line>
      <circle cx="600" cy="342" r="2.5" fill="#A8B8FF" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="3.55s" dur="0.5s" fill="freeze"/>
      </circle>
    </g>

    <text x="60" y="392" font-size="9.5" letter-spacing="3" fill="#3E4558">SINCE 2023</text>
    <text x="1140" y="392" text-anchor="end" font-size="9.5" letter-spacing="3" fill="#3E4558">GITHUB / CIPHERNOCT</text>
  </g>
</svg>
